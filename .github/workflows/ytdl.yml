name: Video Downloader

on:
  repository_dispatch:
    types: [download-youtube, download]
  workflow_dispatch:
    inputs:
      url:
        description: 'Video URL (YouTube, Instagram, Facebook, Reddit, X/Twitter)'
        required: true
        type: string
      caption:
        description: Caption text for Telegram
        required: false
        default: From Albedo
        type: string
      max_videos:
        description: Max videos to download (0 = unlimited, default 3)
        required: false
        default: '3'
        type: string
      mode:
        description: 'video or audio (audio = MP3 320kbps extraction)'
        required: false
        default: video
        type: string
      chat_id:
        description: Sender's Telegram chat ID (for multi-user routing)
        required: false
        type: string

jobs:
  download:
    name: Download and Send to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Debug Event
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Event action: ${{ github.event.action }}"
          echo "URL: ${{ github.event.client_payload.url || inputs.url }}"
          echo "Caption: ${{ github.event.client_payload.caption || inputs.caption }}"
          echo "Max videos: ${{ github.event.client_payload.max_videos || inputs.max_videos }}"
          echo "Mode: ${{ github.event.client_payload.mode || inputs.mode || 'video' }}"

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq zip
          pip install -q -U "yt-dlp[default,curl-cffi]" gallery-dl curl_cffi
          # Install Deno for YouTube n-challenge solving
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          export PATH="$HOME/.deno/bin:$PATH"
          deno --version
          yt-dlp --version
          yt-dlp --list-impersonate-targets | head -n10
          ffmpeg -version | head -n1

      - name: Setup Cookies
        env:
          COOKIES_SECRET: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$COOKIES_SECRET" ]; then
            echo "$COOKIES_SECRET" | base64 -d > cookies_raw.txt 2>/dev/null || true
            if ! head -n1 cookies_raw.txt 2>/dev/null | grep -q "Netscape HTTP Cookie File"; then
              echo "$COOKIES_SECRET" > cookies_raw.txt
            fi

            if head -n1 cookies_raw.txt 2>/dev/null | grep -q "Netscape HTTP Cookie File"; then
              python3 -c "import sys; lines=['# Netscape HTTP Cookie File']; [lines.append(f'{p[0]}\t{\"TRUE\" if p[0].startswith(\".\") else \"FALSE\"}\t{p[2]}\t{p[3]}\t{\"2147483647\" if not p[4].isdigit() or int(p[4])<=0 else p[4]}\t{p[5]}\t{p[6]}') for l in open('cookies_raw.txt', errors='ignore') if l.strip() and not l.startswith('#') for p in [l.strip().split('\t')] if len(p)>=7]; open('cookies.txt', 'w').write('\n'.join(lines)+'\n')"
              rm -f cookies_raw.txt
              echo "Cookies loaded & sanitized ($(wc -l < cookies.txt) lines)"
            else
              echo "WARNING: cookies.txt not valid Netscape format"
              rm -f cookies_raw.txt cookies.txt
            fi
          else
            echo "WARNING: No cookies secret set - will try without auth"
          fi

      - name: Resolve and Normalize URLs
        id: resolve
        shell: bash
        run: |
          URL="${{ github.event.client_payload.url || inputs.url }}"
          echo "Original URL: $URL"

          # Convert YouTube /shorts/ to /watch?v= (bypasses Shorts-specific bot-wall)
          if echo "$URL" | grep -qE 'youtube\.com/shorts/'; then
            SHORT_ID=$(echo "$URL" | sed -E 's/.*shorts\/([a-zA-Z0-9_-]+).*/\1/')
            if [ -n "$SHORT_ID" ]; then
              URL="https://www.youtube.com/watch?v=$SHORT_ID"
              echo "Converted Shorts URL to: $URL"
            fi
          fi

          # Resolve Reddit /s/ shortlinks to full post URLs
          if echo "$URL" | grep -qE 'reddit\.com/r/[^/]+/s/'; then
            echo "Detected Reddit shortlink - resolving..."
            RESOLVED=$(curl -sI -L -o /dev/null -w '%{url_effective}' "$URL" \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36')
            if [ -n "$RESOLVED" ] && [ "$RESOLVED" != "$URL" ]; then
              echo "Resolved to: $RESOLVED"
              URL="$RESOLVED"
            fi
          fi

          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Download Media
        id: download
        shell: bash
        run: |
          URL="${{ steps.resolve.outputs.url }}"
          MAX="${{ github.event.client_payload.max_videos || inputs.max_videos || '3' }}"
          MODE="${{ github.event.client_payload.mode || inputs.mode || 'video' }}"

          echo "URL: $URL"
          echo "Max videos: $MAX"
          echo "Mode: $MODE"

          mkdir -p downloads

          # Build playlist items range
          ITEMS_ARG=""
          if [ "$MAX" != "0" ]; then
            ITEMS_ARG="--playlist-end $MAX"
          fi

          # H.264-first format: prefer avc1 video codec (fixes black-screen on Telegram)
          # AV1/VP9/HEVC play as blank black on Android Telegram, so never send them raw.
          FORMAT="bestvideo[vcodec^=avc1][ext=mp4][height<=1080]+bestaudio[ext=m4a]/bestvideo[ext=mp4][height<=1080]+bestaudio[ext=m4a]/best[ext=mp4]/best"

          if [ "$MODE" = "audio" ]; then
            echo "🎵 AUDIO MODE - extracting MP3 320kbps"
            AUDIO_OPTS="-x --audio-format mp3 --audio-quality 0 --embed-thumbnail --add-metadata -f bestaudio/best"
          else
            AUDIO_OPTS=""
          fi

          # Determine platform and download strategy
          if echo "$URL" | grep -qE 'youtube\.com|youtu\.be'; then
            echo "🎬 YouTube detected - trying player clients in order"
            # 2026 ladder: android, ios, tv, web_safari, mweb
            YT_CLIENTS="android,ios,tv,web_safari,mweb,web_creator,web_embedded"
            download_ok=0
            UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            for client in $(echo "$YT_CLIENTS" | tr ',' ' '); do
              echo "▶️ Trying youtube client: $client"
              rm -rf downloads/*
              yt-dlp --impersonate Chrome --user-agent "$UA" --restrict-filenames --yes-playlist --ignore-errors \
                --remote-components ejs:github \
                --extractor-args "youtube:player_client=$client" \
                $AUDIO_OPTS $ITEMS_ARG -f "$FORMAT" --merge-output-format mp4 \
                -o "downloads/%(playlist_index)03d-%(title).80s.%(ext)s" \
                "$URL" 2>&1 || true
              if [ -d "downloads" ] && [ "$(ls -A downloads/ 2>/dev/null)" ]; then
                echo "✅ Client '$client' worked!"
                download_ok=1
                break
              fi
            done

            # If all clients failed, try with cookies
            if [ "$download_ok" -eq 0 ]; then
              echo "🔄 All clients failed, trying with cookies..."
              if [ -f cookies.txt ] && [ -s cookies.txt ] && head -n1 cookies.txt | grep -q "Netscape HTTP Cookie File"; then
                yt-dlp --impersonate Chrome --user-agent "$UA" --restrict-filenames --yes-playlist --ignore-errors \
                  --remote-components ejs:github \
                  --cookies cookies.txt \
                  $AUDIO_OPTS $ITEMS_ARG -f "$FORMAT" --merge-output-format mp4 \
                  -o "downloads/%(playlist_index)03d-%(title).80s.%(ext)s" \
                  "$URL" 2>&1 || true
              fi
            fi
          else
            echo "📺 Non-YouTube platform - using cookies for auth"
            if [ -f cookies.txt ] && [ -s cookies.txt ] && head -n1 cookies.txt | grep -q "Netscape HTTP Cookie File"; then
              yt-dlp --impersonate Chrome --restrict-filenames --yes-playlist --ignore-errors \
                --remote-components ejs:github \
                --cookies cookies.txt \
                $AUDIO_OPTS $ITEMS_ARG -f "$FORMAT" --merge-output-format mp4 \
                -o "downloads/%(playlist_index)03d-%(title).80s.%(ext)s" \
                "$URL" 2>&1 || true
            else
              echo "⚠️ No valid cookies - trying without auth"
              yt-dlp --impersonate Chrome --restrict-filenames --yes-playlist --ignore-errors \
                --remote-components ejs:github \
                $AUDIO_OPTS $ITEMS_ARG -f "$FORMAT" --merge-output-format mp4 \
                -o "downloads/%(playlist_index)03d-%(title).80s.%(ext)s" \
                "$URL" 2>&1 || true
            fi
          fi

          # Collect files
          if [ -d "downloads" ] && [ "$(ls -A downloads/ 2>/dev/null)" ]; then
            # Flatten any nested gallery-dl output
            find downloads -mindepth 2 -type f -exec mv {} downloads/ \; 2>/dev/null || true
            ls -1 downloads/ > filelist.txt
            echo "Downloaded to downloads/ directory"
          else
            ls -1 *.mp4 *.mkv *.webm *.mp3 2>/dev/null > filelist.txt || true
            if [ -s filelist.txt ]; then
              mkdir -p downloads
              while IFS= read -r f; do mv "$f" "downloads/$f"; done < filelist.txt
              ls -1 downloads/ > filelist.txt
              echo "Moved files to downloads/"
            fi
          fi

          # Instagram gallery fallback (media-downloader ability): if no video, get images
          if [ ! -s filelist.txt ] && echo "$URL" | grep -qE 'instagram\.com'; then
            echo "📸 No video found - trying Instagram gallery (gallery-dl)..."
            rm -rf downloads
            mkdir -p downloads
            if [ -f cookies.txt ] && [ -s cookies.txt ] && head -n1 cookies.txt | grep -q "Netscape HTTP Cookie File"; then
              gallery-dl --cookies cookies.txt -D downloads -o "filename={id}_{num:02}.{extension}" "$URL" 2>&1 || true
            else
              gallery-dl -D downloads -o "filename={id}_{num:02}.{extension}" "$URL" 2>&1 || true
            fi
            find downloads -mindepth 2 -type f -exec mv {} downloads/ \; 2>/dev/null || true
            ls -1 downloads/ 2>/dev/null > filelist.txt || true
            if [ -s filelist.txt ]; then
              echo "✅ Gallery downloaded: $(wc -l < filelist.txt) images"
            fi
          fi

          # Verify we have files
          if [ ! -s filelist.txt ]; then
            echo "ERROR: No files were downloaded"
            ls -la
            exit 1
          fi

          TOTAL=$(wc -l < filelist.txt)
          echo "total_files=$TOTAL" >> $GITHUB_OUTPUT
          echo "source_url=$URL" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Successfully downloaded $TOTAL file(s)"

      - name: Normalize for Telegram (H.264 + yuv420p + faststart)
        shell: bash
        run: |
          # THE BLACK-SCREEN FIX (ported from media-downloader):
          # Telegram Android shows a blank black screen for AV1/VP9/HEVC/HDR(10-bit) videos.
          # Every file must end up as 8-bit H.264 yuv420p MP4 with faststart, exactly
          # like media-downloader's proven local pipeline (libx264 always re-encode).
          echo "🎬 Normalizing all files to H.264/yuv420p for Telegram..."
          while IFS= read -r FILE; do
            FILEPATH="downloads/$FILE"
            [ -f "$FILEPATH" ] || continue
            EXT="${FILE##*.}"

            # Audio files (mp3) need no video normalization
            if [ "$EXT" = "mp3" ] || [ "$EXT" = "m4a" ]; then
              echo "🎵 $FILE - audio, skipping video normalize"
              continue
            fi

            # Probe the actual video codec + pixel format
            CODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$FILEPATH" 2>/dev/null | head -n1)
            PIXFMT=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$FILEPATH" 2>/dev/null | head -n1)
            echo "🔍 $FILE -> codec=$CODEC pix_fmt=$PIXFMT"

            NORM="downloads/normalized-$FILE.mp4"

            if [ "$CODEC" = "h264" ] && [ "$PIXFMT" = "yuv420p" ]; then
              # Already perfect - just fast-remux (moov atom to front, no quality loss)
              echo "✅ $FILE already H.264/yuv420p - fast remux only"
              ffmpeg -y -i "$FILEPATH" -c copy -movflags +faststart "$NORM" 2>&1 || true
            else
              # Re-encode to 8-bit H.264 yuv420p (media-downloader proven recipe)
              echo "🔄 $FILE re-encoding to H.264/yuv420p (codec fix)..."
              ffmpeg -y -i "$FILEPATH" \
                -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p \
                -c:a aac -b:a 128k -movflags +faststart \
                -vf "scale='min(1920,iw)':min'(1080,ih)':force_original_aspect_ratio=decrease" \
                "$NORM" 2>&1 || true
            fi

            if [ -f "$NORM" ]; then
              mv "$NORM" "$FILEPATH"
              NEWCODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$FILEPATH" 2>/dev/null | head -n1)
              echo "   -> normalized: codec=$NEWCODEC size=$(( $(stat -c%s "$FILEPATH") / 1048576 ))MB"
            else
              echo "⚠️ Normalize failed for $FILE - sending as-is"
            fi
          done < filelist.txt
          echo "✅ Normalization complete"

      - name: Upload to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id || github.event.client_payload.chat_id || secrets.TG_CHAT_ID }}
        shell: bash
        run: |
          CAPTION="${{ github.event.client_payload.caption || inputs.caption || 'From Albedo' }}"
          MODE="${{ github.event.client_payload.mode || inputs.mode || 'video' }}"
          TOTAL=$(wc -l < filelist.txt)
          COUNT=1

          while IFS= read -r FILE; do
            FILEPATH="downloads/$FILE"
            if [ ! -f "$FILEPATH" ]; then
              echo "WARNING: File not found: $FILEPATH"
              COUNT=$((COUNT + 1))
              continue
            fi

            EXT="${FILE##*.}"
            SIZE_BYTES=$(stat -c%s "$FILEPATH" 2>/dev/null || stat -f%z "$FILEPATH" 2>/dev/null || echo "0")

            # Build caption with progress counter
            if [ "$TOTAL" -gt 1 ]; then
              VIDEO_LABEL="${CAPTION} - Video $COUNT/$TOTAL"
            else
              VIDEO_LABEL="$CAPTION"
            fi

            # --- AUDIO MODE: send as audio ---
            if [ "$EXT" = "mp3" ] || [ "$EXT" = "m4a" ]; then
              SIZE_MB=$(du -m "$FILEPATH" 2>/dev/null | cut -f1 || echo "?")
              echo "Sending audio $FILEPATH (${SIZE_MB}MB)"
              RESPONSE=$(curl -s -F "chat_id=$CHAT_ID" \
                -F "audio=@$FILEPATH" \
                -F "caption=$VIDEO_LABEL" \
                -F "performer=Albedo" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendAudio")
              if echo "$RESPONSE" | grep -q '"ok":true'; then
                echo "Sent $COUNT/$TOTAL as audio"
              else
                curl -s -F "chat_id=$CHAT_ID" \
                  -F "document=@$FILEPATH" \
                  -F "caption=$VIDEO_LABEL" \
                  "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
                echo "Sent $COUNT/$TOTAL as document (audio fallback)"
              fi
              COUNT=$((COUNT + 1))
              sleep 1
              continue
            fi

            # --- IMAGE MODE (gallery): send single image as photo, multiple as zip ---
            if [ "$EXT" = "jpg" ] || [ "$EXT" = "jpeg" ] || [ "$EXT" = "png" ] || [ "$EXT" = "webp" ]; then
              SIZE_MB=$(du -m "$FILEPATH" 2>/dev/null | cut -f1 || echo "?")
              IMAGES=$(ls -1 downloads/*.jpg downloads/*.jpeg downloads/*.png downloads/*.webp 2>/dev/null | wc -l)
              if [ "$IMAGES" -gt 1 ]; then
                echo "📦 Multiple gallery images - zipping..."
                cd downloads && zip -q gallery.zip *.jpg *.jpeg *.png *.webp 2>/dev/null || true; cd ..
                ZIPFILE="downloads/gallery.zip"
                if [ -f "$ZIPFILE" ]; then
                  curl -s -F "chat_id=$CHAT_ID" \
                    -F "document=@$ZIPFILE" \
                    -F "caption=$VIDEO_LABEL" \
                    "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
                  echo "Sent gallery zip ($IMAGES images)"
                  COUNT=$((COUNT + 1))
                  sleep 1
                  continue
                fi
              fi
              curl -s -F "chat_id=$CHAT_ID" \
                -F "photo=@$FILEPATH" \
                -F "caption=$VIDEO_LABEL" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendPhoto"
              echo "Sent $COUNT/$TOTAL as photo"
              COUNT=$((COUNT + 1))
              sleep 1
              continue
            fi

            # --- VIDEO MODE: compress if over 48MB (Telegram Bot API limit is 50MB) ---
            if [ "$EXT" = "mp4" ] || [ "$EXT" = "mkv" ] || [ "$EXT" = "webm" ]; then
              if [ "$SIZE_BYTES" -gt 50331648 ]; then
                echo "File is over 48MB ($((SIZE_BYTES/1048576))MB), compressing..."
                COMPRESSED="downloads/compressed-${FILE}.mp4"
                # Pass 1: CRF 30, 720p (always yuv420p - black screen protection)
                ffmpeg -y -i "$FILEPATH" \
                  -c:v libx264 -crf 30 -pix_fmt yuv420p \
                  -c:a aac -b:a 128k \
                  -movflags +faststart \
                  -vf "scale='min(1280,iw)':min'(720,ih)':force_original_aspect_ratio=decrease" \
                  "$COMPRESSED" 2>&1
                if [ -f "$COMPRESSED" ]; then
                  mv "$COMPRESSED" "$FILEPATH"
                  SIZE_BYTES=$(stat -c%s "$FILEPATH" 2>/dev/null || stat -f%z "$FILEPATH" 2>/dev/null || echo "0")
                  echo "Pass 1 done: $((SIZE_BYTES/1048576))MB"
                fi
                # Pass 2: if still over 48MB, go harder (CRF 35, 480p)
                if [ "$SIZE_BYTES" -gt 50331648 ]; then
                  echo "Still over limit ($((SIZE_BYTES/1048576))MB), second compression pass..."
                  ffmpeg -y -i "$FILEPATH" \
                    -c:v libx264 -crf 35 -pix_fmt yuv420p \
                    -c:a aac -b:a 96k \
                    -movflags +faststart \
                    -vf "scale='min(854,iw)':min'(480,ih)':force_original_aspect_ratio=decrease" \
                    "$COMPRESSED" 2>&1
                  if [ -f "$COMPRESSED" ]; then
                    mv "$COMPRESSED" "$FILEPATH"
                    SIZE_BYTES=$(stat -c%s "$FILEPATH" 2>/dev/null || stat -f%z "$FILEPATH" 2>/dev/null || echo "0")
                    echo "Pass 2 done: $((SIZE_BYTES/1048576))MB"
                  fi
                fi
              fi

              SIZE_MB=$(du -m "$FILEPATH" 2>/dev/null | cut -f1 || echo "?")
              echo "Sending $FILEPATH (${SIZE_MB}MB) - $COUNT/$TOTAL"

              RESPONSE=$(curl -s -F "chat_id=$CHAT_ID" \
                -F "video=@$FILEPATH" \
                -F "caption=$VIDEO_LABEL" \
                -F "supports_streaming=true" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendVideo")

              if echo "$RESPONSE" | grep -q '"ok":true'; then
                echo "Sent $COUNT/$TOTAL as video"
              else
                echo "Video send failed, trying as document..."
                curl -s -F "chat_id=$CHAT_ID" \
                  -F "document=@$FILEPATH" \
                  -F "caption=$VIDEO_LABEL" \
                  "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
                echo "Sent $COUNT/$TOTAL as document (fallback)"
              fi
            else
              curl -s -F "chat_id=$CHAT_ID" \
                -F "document=@$FILEPATH" \
                -F "caption=$VIDEO_LABEL" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
              echo "Sent $COUNT/$TOTAL as document"
            fi

            COUNT=$((COUNT + 1))
            sleep 1
          done < filelist.txt

          # Summary message for multi-file sends
          if [ "$TOTAL" -gt 1 ]; then
            PLATFORM=$(echo "${{ steps.resolve.outputs.url }}" | sed 's|https\?://\([^/]*\).*|\1|')
            curl -s -F "chat_id=$CHAT_ID" \
              -F "text=Done: $TOTAL files from $PLATFORM ($MODE mode)" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendMessage"
            echo "Summary sent"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -rf downloads filelist.txt cookies.txt
          echo "Cleaned up"
