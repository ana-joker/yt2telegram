name: YouTube Downloader Dev

on:
  workflow_dispatch:
    inputs:
      url:
        description: Video/Playlist URL (YouTube, Instagram, Facebook, X/Twitter, Reddit)
        required: true
        type: string
      caption:
        description: Caption text for Telegram
        required: false
        default: From Albedo
        type: string
      max_videos:
        description: Max videos to download (0 = unlimited, default 3)
        required: false
        default: '3'
        type: string
  repository_dispatch:
    types: [download-dev]

jobs:
  download:
    name: Download and Send to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Debug Event
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "URL: ${{ github.event.client_payload.url || inputs.url }}"
          echo "Caption: ${{ github.event.client_payload.caption || inputs.caption }}"
          echo "Max videos: ${{ github.event.client_payload.max_videos || inputs.max_videos }}"

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
          pip install -q -U yt-dlp
          yt-dlp --version

      - name: Download Media
        id: download
        shell: bash
        run: |
          URL="${{ github.event.client_payload.url || inputs.url }}"
          MAX="${{ github.event.client_payload.max_videos || inputs.max_videos || '3' }}"
          FORMAT="bestvideo[ext=mp4][height<=1080]+bestaudio[ext=m4a]/best[ext=mp4]/best"

          echo "URL: $URL"
          echo "Max videos: $MAX"
          echo "Format: $FORMAT"

          mkdir -p downloads

          # Build playlist items range
          ITEMS_ARG=""
          if [ "$MAX" != "0" ]; then
            ITEMS_ARG="--playlist-end $MAX"
          fi

          # Try android client first, then fallback to default
          # --ignore-errors skips videos that need auth
          yt-dlp --restrict-filenames \
            --yes-playlist \
            --ignore-errors \
            --extractor-args "youtube:player_client=android" \
            $ITEMS_ARG \
            -f "$FORMAT" \
            --merge-output-format mp4 \
            -o "downloads/%(playlist_index)03d-%(title).80s.%(ext)s" \
            "$URL" 2>&1

          # Collect files - first check downloads/ dir
          if [ -d "downloads" ] && [ "$(ls -A downloads/ 2>/dev/null)" ]; then
            ls -1 downloads/ > filelist.txt
            echo "Downloaded to downloads/ directory"
          else
            # Fallback: check root for single files
            ls -1 *.mp4 *.mkv *.webm 2>/dev/null > filelist.txt || true
            if [ -s filelist.txt ]; then
              mkdir -p downloads
              while IFS= read -r f; do mv "$f" "downloads/$f"; done < filelist.txt
              ls -1 downloads/ > filelist.txt
              echo "Moved files to downloads/"
            fi
          fi

          # Verify we have files
          if [ ! -s filelist.txt ]; then
            echo "ERROR: No video files were downloaded"
            ls -la
            exit 1
          fi

          TOTAL=$(wc -l < filelist.txt)
          echo "total_files=$TOTAL" >> $GITHUB_OUTPUT
          echo "source_url=$URL" >> $GITHUB_OUTPUT
          echo "Successfully downloaded $TOTAL file(s)"

      - name: Upload to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        shell: bash
        run: |
          CAPTION="${{ github.event.client_payload.caption || inputs.caption || 'From Albedo' }}"
          TOTAL=$(wc -l < filelist.txt)
          COUNT=1

          while IFS= read -r FILE; do
            FILEPATH="downloads/$FILE"
            if [ ! -f "$FILEPATH" ]; then
              echo "WARNING: File not found: $FILEPATH"
              COUNT=$((COUNT + 1))
              continue
            fi

            EXT="${FILE##*.}"
            SIZE_BYTES=$(stat -c%s "$FILEPATH" 2>/dev/null || stat -f%z "$FILEPATH" 2>/dev/null || echo "0")

            # Compress if over 48MB (Telegram Bot API limit is 50MB, safety margin)
            if [ "$SIZE_BYTES" -gt 50331648 ]; then
              echo "File is over 48MB ($((SIZE_BYTES/1048576))MB), compressing..."
              COMPRESSED="downloads/compressed-${FILE}"
              ffmpeg -y -i "$FILEPATH" \
                -c:v libx264 -crf 28 \
                -c:a aac -b:a 128k \
                -movflags +faststart \
                -vf "scale='min(1280,iw)':min'(720,ih)':force_original_aspect_ratio=decrease" \
                "$COMPRESSED" 2>&1
              if [ -f "$COMPRESSED" ]; then
                mv "$COMPRESSED" "$FILEPATH"
                echo "Compressed successfully"
              else
                echo "Compression failed, trying original file"
              fi
            fi

            SIZE_MB=$(du -m "$FILEPATH" 2>/dev/null | cut -f1 || echo "?")

            # Build caption with progress counter
            if [ "$TOTAL" -gt 1 ]; then
              VIDEO_LABEL="${CAPTION} - Video $COUNT/$TOTAL"
            else
              VIDEO_LABEL="$CAPTION"
            fi

            echo "Sending $FILEPATH (${SIZE_MB}MB) - $COUNT/$TOTAL"

            if [ "$EXT" = "mp4" ] || [ "$EXT" = "mkv" ] || [ "$EXT" = "webm" ]; then
              RESPONSE=$(curl -s -F "chat_id=$CHAT_ID" \
                -F "video=@$FILEPATH" \
                -F "caption=$VIDEO_LABEL" \
                -F "supports_streaming=true" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendVideo")

              if echo "$RESPONSE" | grep -q '"ok":true'; then
                echo "Sent $COUNT/$TOTAL as video"
              else
                echo "Video send failed, trying as document..."
                curl -s -F "chat_id=$CHAT_ID" \
                  -F "document=@$FILEPATH" \
                  -F "caption=$VIDEO_LABEL" \
                  "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
                echo "Sent $COUNT/$TOTAL as document (fallback)"
              fi
            else
              curl -s -F "chat_id=$CHAT_ID" \
                -F "document=@$FILEPATH" \
                -F "caption=$VIDEO_LABEL" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
              echo "Sent $COUNT/$TOTAL as document"
            fi

            COUNT=$((COUNT + 1))
            sleep 1
          done < filelist.txt

          # Summary message for multi-file sends
          if [ "$TOTAL" -gt 1 ]; then
            PLATFORM=$(echo "${{ steps.download.outputs.source_url }}" | sed 's|https\?://\([^/]*\).*|\1|')
            curl -s -F "chat_id=$CHAT_ID" \
              -F "text=Done: $TOTAL videos from $PLATFORM" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendMessage"
            echo "Summary sent"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -rf downloads filelist.txt
          echo "Cleaned up"
